<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Coolcook</title>
<meta name="theme-color" content="#fdf6ec">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg-app: #fdf6ec;
    --bg-card: #ffffff;
    --border: #e6d9c2;
    --text: #3a2e1f;
    --text-dim: #8a7a63;
    --accent: #b0522d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg-app);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .font-cinzel { font-family: 'Cinzel', serif; }
  #app { height: 100dvh; height: 100vh; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'coolcook_state';

  function defaultState() {
    return { recipes: [] };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      return Object.assign(defaultState(), JSON.parse(raw));
    } catch (e) {
      return defaultState();
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  var state = loadState();

  function render() {
    var app = document.getElementById('app');
    app.innerHTML =
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:24px;">' +
        '<h1 class="font-cinzel" style="font-size:28px;font-weight:700;margin-bottom:8px;">Coolcook</h1>' +
        '<p style="color:var(--text-dim);">Base du projet en place. À construire.</p>' +
      '</div>';
  }

  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js');
    });
  }
})();
</script>
</body>
</html>
